<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Atlas - Developer Profile</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --skill-bg: rgba(56, 189, 248, 0.12);
      --skill-border: rgba(56, 189, 248, 0.25);
      --btn-bg: #0284c7;
      --btn-hover: #0369a1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      color: var(--text-main);
    }

    .profile-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: 1.25rem;
      padding: 2.5rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px var(--accent-glow);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .profile-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5), 0 0 28px var(--accent-glow);
    }

    .avatar-wrapper {
      position: relative;
      width: 104px;
      height: 104px;
      margin: 0 auto 1.5rem;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      color: #0f172a;
      border: 3px solid #38bdf8;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .badge-status {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      background: #22c55e;
      border-radius: 50%;
      border: 3px solid #1e293b;
    }

    .name {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
      color: var(--text-main);
    }

    .role {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 1.25rem;
    }

    .bio {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
    }

    .skills-section {
      margin-bottom: 2rem;
    }

    .skills-heading {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .skills-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }

    .skill-tag {
      background: var(--skill-bg);
      border: 1px solid var(--skill-border);
      color: #7dd3fc;
      padding: 0.4rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 500;
    }

    .actions {
      display: flex;
      justify-content: center;
    }

    .portfolio-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--btn-bg);
      color: #ffffff;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.65rem;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .portfolio-link:hover {
      background: var(--btn-hover);
      transform: translateY(-2px);
    }

    .portfolio-link svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <main>
    <article class="profile-card">
      <div class="avatar-wrapper">
        <div class="avatar" aria-hidden="true">HS</div>
        <span class="badge-status" title="Active on Project Atlas"></span>
      </div>

      <header>
        <h1 class="name">Hamza Shaikh</h1>
        <p class="role">Full Stack Developer</p>
      </header>

      <p class="bio">
        Passionate software engineer building resilient web applications, intelligent developer workflows, and scalable systems for Project Atlas.
      </p>

      <section class="skills-section" aria-label="Core Skills">
        <h2 class="skills-heading">Core Skills</h2>
        <ul class="skills-list">
          <li class="skill-tag">JavaScript / TypeScript</li>
          <li class="skill-tag">Git & PR Workflows</li>
          <li class="skill-tag">Full-Stack Architecture</li>
        </ul>
      </section>

      <div class="actions">
        <a href="https://github.com/HamzaShaikh-source" class="portfolio-link" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          View GitHub Profile
        </a>
      </div>
    </article>
  </main>
</body>
</html>
